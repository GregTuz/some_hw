name: python-final

services:
  postgresql:
    build: ./components/postgres
    container_name: postgresql
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgres/data
      - ./components/postgres/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_network

  mysql:
    build: ./components/mysql
    container_name: mysql
    environment:
      MYSQL_USER: user
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./components/mysql/init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_network

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./volumes/pgadmin:/var/lib/pgadmin
    ports:
      - "6060:80"
    networks:
      - app_network
    restart: unless-stopped

  zookeeper:
    build: ./components/zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: '2181'
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 30s
      retries: 5
      start_period: 1m
      timeout: 30s
    ports:
      - "2181:2181"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_network

  kafka:
    build: ./components/kafka/kafka_main
    hostname: kafka
    container_name: kafka
    ports:
      - "29092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_INTERNAL_CONNECT_PATH: kafka:29092
      KAFKA_TOPIC_NAME: events
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_network

  kafka-init:
    build: ./components/kafka/kafka_init
    container_name: kafka-init
    depends_on:
      - kafka
    environment:
      KAFKA_INTERNAL_CONNECT_PATH: kafka:29092
      KAFKA_TOPIC_NAME: events
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_network

  spark-master:
    build: ./components/spark/spark_master
    container_name: spark_master
    environment:
      SPARK_RPC_AUTHENTICATION_ENABLED: no
      SPARK_RPC_ENCRYPTION_ENABLED: no
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
      SPARK_SSL_ENABLED: no
      SPARK_MODE: master
      SPARK_MASTER_WEBUI_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - spark-data:/bitnami
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - app_network

  spark-worker:
    build: ./components/spark/spark_worker
    container_name: spark_worker
    environment:
      SPARK_RPC_AUTHENTICATION_ENABLED: no
      SPARK_RPC_ENCRYPTION_ENABLED: no
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
      SPARK_SSL_ENABLED: no
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 1
    volumes:
      - spark-data:/bitnami
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - app_network

  pg-datagen:
    build: ./components/pg_datagen
    container_name: pg-datagen
    volumes:
      - ./code/datagen/pg_datagen:/app/src
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_network

  airflow-init:
    build: ./components/airflow/init
    container_name: airflow-init
    volumes:
      - ./volumes/Airflow/dags:/opt/airflow/dags
      - ./volumes/Airflow/scripts:/opt/airflow/scripts
      - sqlite-airflow-data:/usr/local/airflow/db:rw
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_network

# Не работает из-за того что jdk постаить не может:(
  airflow-scheduler:
    build: ./components/airflow/scheduler
    depends_on:
      - airflow-init
    container_name: airflow-scheduler
    restart: always
    volumes:
      - ./volumes/Airflow/dags:/opt/airflow/dags
      - ./volumes/Airflow/scripts:/opt/airflow/scripts
      - sqlite-airflow-data:/usr/local/airflow/db:rw
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  airflow-webserver:
    build: ./components/airflow/webserver
    depends_on:
      - airflow-init
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./volumes/Airflow/dags:/opt/airflow/dags
      - ./volumes/Airflow/scripts:/opt/airflow/scripts
      - sqlite-airflow-data:/usr/local/airflow/db:rw
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  postgresql-data:
  mysql-data:
  sqlite-airflow-data:
  spark-data:
networks:
  app_network: